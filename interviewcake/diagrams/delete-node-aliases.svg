<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Deletion through a target node reference</title><desc id="desc">Before deletion, node objects n0 through n3 contain 9,4,7,2. Target n1 copies n2's value and next link, becoming value 7 and linking to n3. Node n2 remains a separate aliased object containing 7 and linking to n3, but is no longer reachable from the head.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52657d"/></marker></defs><rect width="760" height="340" rx="14" fill="#f7f9fc"/>
<g font-family="system-ui,sans-serif" font-size="17" fill="#15243b"><text x="25" y="35">Before: target is object n1</text><text x="25" y="177">After: n1 remains; n2 is bypassed</text></g>
<g fill="#fff" stroke="#52657d" stroke-width="2"><rect x="65" y="65" width="90" height="55" rx="7"/><rect x="245" y="65" width="90" height="55" rx="7" fill="#fde5c9"/><rect x="425" y="65" width="90" height="55" rx="7"/><rect x="605" y="65" width="90" height="55" rx="7"/><rect x="65" y="220" width="90" height="55" rx="7"/><rect x="245" y="220" width="90" height="55" rx="7" fill="#dcf4e6"/><rect x="605" y="220" width="90" height="55" rx="7"/><rect x="425" y="220" width="90" height="55" rx="7" fill="#edf0f5" stroke-dasharray="5 4"/></g>
<g stroke="#52657d" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M155 92H238"/><path d="M335 92H418"/><path d="M515 92H598"/><path d="M155 247H238"/><path d="M335 235Q470 170 605 235"/><path d="M515 258H598"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#15243b" font-size="16"><text x="110" y="99">n0: 9</text><text x="290" y="99">n1: 4</text><text x="470" y="99">n2: 7</text><text x="650" y="99">n3: 2</text><text x="110" y="254">n0: 9</text><text x="290" y="254">n1: 7</text><text x="470" y="254">n2: 7</text><text x="650" y="254">n3: 2</text><text x="470" y="304" font-size="14">An alias still refers to n2.</text></g></svg>
