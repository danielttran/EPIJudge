<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" role="img" aria-labelledby="title desc">
<title id="title">Positive-area rectangle intersection</title><desc id="desc">Rectangle A has lower-left 1,2 and dimensions 6 by 4. Rectangle B has lower-left 4,0 and dimensions 5 by 4. Their overlap starts at 4,2 and has width 3 and height 2.</desc><rect width="620" height="350" rx="14" fill="#f7f9fc"/>
<g stroke="#52657d" stroke-width="2"><path d="M65 290H535M65 290V35"/></g><g font-family="system-ui,sans-serif" font-size="13" fill="#344962" text-anchor="middle"><text x="65" y="310">0</text><text x="110" y="310">1</text><text x="245" y="310">4</text><text x="380" y="310">7</text><text x="470" y="310">9</text><text x="548" y="294">x</text><text x="64" y="24">y</text><text x="48" y="214">2</text><text x="48" y="134">4</text><text x="48" y="54">6</text></g>
<rect x="110" y="50" width="270" height="160" fill="#dceafb" stroke="#2b66a5" stroke-width="3"/><rect x="245" y="130" width="225" height="160" fill="#fde5c9" fill-opacity=".75" stroke="#a96622" stroke-width="3"/><rect x="245" y="130" width="135" height="80" fill="#9fd8c0" fill-opacity=".95" stroke="#26734e" stroke-width="3"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#15243b"><text x="170" y="85" font-size="16">A: (1,2), 6 × 4</text><text x="373" y="265" font-size="16">B: (4,0), 5 × 4</text><text x="312" y="164" font-size="15">Overlap</text><text x="312" y="185" font-size="15">3 × 2</text><text x="310" y="337" font-size="16">Intersection: (4,2), width 3, height 2</text></g></svg>
