<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img" aria-labelledby="title desc">
<title id="title">Global leaf-depth balance</title><desc id="desc">A chain 4 to 2 to 1 to 0 has one leaf at depth three and passes. A separate tree has root 4, a left chain 2 to 1 to 0 and a right leaf 7. Its leaves have depths three and one, so the spread is two and it fails.</desc>
<rect width="740" height="300" rx="14" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#15243b"><text x="190" y="28" font-size="18" font-weight="600">One leaf: spread 0</text><text x="550" y="28" font-size="18" font-weight="600">Two leaves: spread 2</text></g>
<g stroke="#52657d" stroke-width="2"><path d="M190 65v40m0 30v40m0 30v40"/><path d="M550 65l-65 45m65-45l70 45M485 140v35m0 30v40"/></g>
<g fill="#fff" stroke="#52657d" stroke-width="2"><circle cx="190" cy="55" r="18"/><circle cx="190" cy="125" r="18"/><circle cx="190" cy="195" r="18"/><circle cx="550" cy="55" r="18"/><circle cx="485" cy="125" r="18"/><circle cx="485" cy="195" r="18"/></g>
<g fill="#dcf4e6" stroke="#26734e" stroke-width="2"><circle cx="190" cy="265" r="18"/><circle cx="485" cy="265" r="18"/><circle cx="620" cy="125" r="18"/></g>
<g font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#15243b"><text x="190" y="60">4</text><text x="190" y="130">2</text><text x="190" y="200">1</text><text x="190" y="270">0</text><text x="550" y="60">4</text><text x="485" y="130">2</text><text x="485" y="200">1</text><text x="485" y="270">0</text><text x="620" y="130">7</text></g>
<g font-family="system-ui,sans-serif" font-size="14" fill="#344962"><text x="220" y="270">depth 3</text><text x="515" y="270">depth 3</text><text x="650" y="130">depth 1</text><text x="32" y="65">Root depth 0</text></g></svg>
