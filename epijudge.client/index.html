<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121419" />
    <title>EPI Practice · Multi-Language Workspace</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root">
      <div id="workspace-loading" role="status" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#101216;color:#8e9aa8;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;">
        <div style="text-align:center;">
          <div style="font-weight:600;font-size:20px;color:#dde1e8;margin-bottom:8px;">EPI Practice</div>
          <div id="workspace-loading-message" style="font-size:14px;">Loading workspace…</div>
          <button id="workspace-reload" hidden style="margin-top:16px;padding:8px 16px;cursor:pointer;">Reload workspace</button>
          <noscript><p>Enable JavaScript to open the practice workspace.</p></noscript>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const showFailure = () => {
          const message = document.getElementById('workspace-loading-message');
          const reload = document.getElementById('workspace-reload');
          if (!message || !reload) return; // React has already mounted.
          message.textContent = 'The workspace scripts could not load. Reload to try again.';
          reload.hidden = false;
        };
        document.getElementById('workspace-reload').addEventListener('click', () => location.reload());
        window.addEventListener('error', showFailure);
        window.addEventListener('unhandledrejection', showFailure);
        setTimeout(showFailure, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
